<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas (Transparent Dark) -->
  <rect width="1200" height="320" rx="32" fill="#0b1329" fill-opacity="0.95" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand Icon Squircle (Left Side) -->
  <g transform="translate(48, 48)">
    <rect width="224" height="224" rx="52" fill="url(#iconGrad)" filter="url(#dropShadow)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Topo Contour Lines -->
    <path d="M 20 80 Q 70 50, 120 70 T 204 60" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" fill="none" />
    <path d="M 20 120 Q 80 90, 140 125 T 204 100" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" fill="none" />
    <path d="M 20 160 Q 70 150, 130 180 T 204 150" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" fill="none" />

    <!-- 3D Folded Map -->
    <g transform="translate(42, 52)">
      <polygon points="0,20 44,5 44,125 0,140" fill="#0f172a" opacity="0.92" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
      <polygon points="44,5 98,25 98,145 44,125" fill="#1e293b" opacity="0.92" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
      <polygon points="98,25 140,8 140,128 98,145" fill="#0f172a" opacity="0.92" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
      
      <!-- GPS Location Pin Target -->
      <g transform="translate(71, 55)">
        <ellipse cx="0" cy="26" rx="12" ry="5" fill="#000000" opacity="0.6"/>
        <path d="M 0,24 C -2,16 -16,8 -16,-8 C -16,-17 -9,-24 0,-24 C 9,-24 16,-17 16,-8 C 16,8 2,16 0,24 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="0" cy="-8" r="5" fill="#ffffff" />
        <circle cx="0" cy="-8" r="2.5" fill="#f43f5e" />
      </g>
    </g>
  </g>

  <!-- Typography & Brand Text (Right Side) -->
  <g transform="translate(310, 80)">
    <!-- Main App Name -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="-2" fill="#ffffff">
      GoField <tspan fill="#38bdf8">Pro</tspan>
    </text>

    <!-- Subtitle / Professional Category -->
    <text x="5" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#10b981">
      TOPOGRAFIA • MAPAS PDF • CUBAGEM FLORESTAL
    </text>

    <!-- Company Badge -->
    <g transform="translate(5, 158)">
      <rect width="320" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">
        DESENVOLVIDO POR AM TST
      </text>
    </g>
  </g>
</svg>
