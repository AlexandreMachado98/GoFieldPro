<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Topo contour subtle lines in background -->
  <path d="M 40 180 Q 140 120, 260 160 T 472 130" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" fill="none" />
  <path d="M 40 260 Q 180 200, 300 270 T 472 220" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35" fill="none" />
  <path d="M 40 340 Q 150 320, 270 380 T 472 310" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.2" fill="none" />

  <!-- Folded Map Polygon -->
  <g filter="url(#shadow)" transform="translate(96, 116)">
    <!-- Map panel 1 -->
    <polygon points="0,40 100,10 100,250 0,280" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    <!-- Map panel 2 -->
    <polygon points="100,10 220,50 220,290 100,250" fill="#1e293b" opacity="0.9" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    <!-- Map panel 3 -->
    <polygon points="220,50 320,15 320,255 220,290" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- GPS Location Target Pin -->
    <g transform="translate(160, 110)">
      <!-- Target ring shadow on map -->
      <ellipse cx="0" cy="50" rx="22" ry="9" fill="#000000" opacity="0.6"/>
      
      <!-- Pin Body -->
      <path d="M 0,48 C -4,32 -32,16 -32,-16 C -32,-34 -18,-48 0,-48 C 18,-48 32,-34 32,-16 C 32,16 4,32 0,48 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
      
      <!-- Pin Center Dot -->
      <circle cx="0" cy="-16" r="11" fill="#ffffff" />
      <circle cx="0" cy="-16" r="5" fill="#f43f5e" />
    </g>
  </g>
</svg>
