<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with smooth squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Topographic Contour Curves -->
  <g stroke="#10b981" stroke-width="3" stroke-opacity="0.3" fill="none">
    <path d="M 30,160 Q 150,90 260,140 T 482,120" />
    <path d="M 30,240 Q 180,180 290,250 T 482,210" />
    <path d="M 30,320 Q 140,290 280,350 T 482,290" />
    <path d="M 30,400 Q 160,370 270,430 T 482,380" />
  </g>

  <!-- Isometric Ground Grid -->
  <g transform="translate(106, 270)" opacity="0.45">
    <polygon points="150,0 300,75 150,150 0,75" fill="#064e3b" stroke="#34d399" stroke-width="3" />
    <line x1="75" y1="37.5" x2="225" y2="112.5" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="225" y1="37.5" x2="75" y2="112.5" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Pine Tree Element (Forestry & Environment) -->
  <g transform="translate(295, 175)" filter="url(#neonGlow)">
    <polygon points="45,0 75,45 60,45 85,90 65,90 95,140 0,140 25,90 10,90 35,45 15,45" fill="url(#emeraldGlow)" stroke="#ffffff" stroke-width="2" />
    <rect x="38" y="140" width="16" height="25" rx="3" fill="#064e3b" />
  </g>

  <!-- GPS Target Location Pin (Central Hero Element) -->
  <g transform="translate(195, 150)" filter="url(#softShadow)">
    <!-- Outer Target Pulse Ring -->
    <circle cx="40" cy="40" r="65" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="6,6" />
    <line x1="40" y1="-35" x2="40" y2="115" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="-35" y1="40" x2="115" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Pin Shape -->
    <path d="M 40,145 C 32,105 -15,65 -15,15 C -15,-20 10,-45 40,-45 C 70,-45 95,-20 95,15 C 95,65 48,105 40,145 Z" fill="url(#emeraldGlow)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Inner Core & Crosshair Dot -->
    <circle cx="40" cy="15" r="22" fill="#020617" />
    <circle cx="40" cy="15" r="14" fill="#38bdf8" />
    <circle cx="40" cy="15" r="6" fill="#ffffff" />
  </g>
</svg>
